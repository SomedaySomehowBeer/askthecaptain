    const selected=screens.some(s=>s.id===requested)?screens.filter(s=>s.id===requested):screens;
    if(selected.length===1)document.body.classList.add('single');
    document.getElementById('gallery').innerHTML=selected.map(s=>`<section class="study"><div class="phone ${s.id}" data-screen="${s.id}"><div class="status"><span>9:41</span><span class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</span></div><header class="app-header"><a class="brand" href="${link('day')}"><img src="../../../../packages/ui/design/assets/logo-mark-ink.svg" alt="">CAPTAIN</a><div class="header-actions"><button class="icon-button" aria-label="Search Captain" data-sheet="search">${icon('search')}</button><span class="avatar" aria-label="Ryan White">RW</span></div></header><div class="content">${s.content}</div>${nav(s.active)}<div class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="Mockup detail"><div class="sheet-head"><h2></h2><button class="close" aria-label="Close detail">${icon('close')}</button></div><div class="sheet-body"></div></section></div></div><div class="caption"><strong>${s.title}</strong><p>${s.caption}</p></div></section>`).join('');
    const sheetContent={'other-work':['Other work','<p>This item belongs to a different project or a recurring duty. The shared task list keeps it alongside launch work. Its detail screen is outside these three mockups.</p>'],browse:['Browse the business',`<div class="eyebrow">Areas</div><a href="${link('project')}">${icon('tank')}Production · see launch example</a><a href="${link('marketing')}">${icon('megaphone')}Marketing</a><p>Sales and Admin area screens follow this pattern.</p><div class="eyebrow">Shared resources</div><p>Inventory · Files · Equipment schedule · People · Reports</p><div class="eyebrow">Review prototype</div><p>Three proposed screens. Other destinations are not built in this mockup.</p>`],areas:['Work across every area',`<p>My work includes all of Ryan’s assignments, regardless of area. Area filters narrow this list without moving or copying tasks.</p><a href="${link('marketing')}">Explore the Marketing area ${icon('arrow')}</a>`],chat:['Summer lager · Discussion',`<p><strong>Beau:</strong> Could we package in the afternoon instead?</p><p style="margin-top:12px">Linked task: <strong>Confirm packaging slot</strong>. The task links back to this same discussion.</p><a href="${link('project')}">Open linked project ${icon('arrow')}</a><p style="margin-top:12px">Review mockup: posting messages is not implemented.</p>`],schedule:['Equipment schedule',`<p><strong>Confirmed:</strong> FV-02 tank preparation, 22 September, 13:00–15:00.</p><p style="margin-top:12px"><strong>Conflict:</strong> Packaging line, 1 October, 09:00–12:00 is already reserved for Pale ale packaging. The Summer lager request remains unconfirmed.</p><p style="margin-top:12px">A full resource timeline, availability checks and rescheduling are required in the implementation. This preview does not change bookings.</p>`],asset:['Can artwork · v3',`<p>Working version awaiting review. Two comments are attached to this version, with a link to “Approve can artwork”. The original remains in Drive.</p><a href="${link('project')}">Open linked launch project ${icon('arrow')}</a>`],'asset-ready':['Trade pack · v2','<p>This specific version is marked ready to use. It is shared with Sales and remains part of the same asset library. Artwork is illustrative placeholder content.</p>'],assets:['Shared asset library','<p>Marketing collections, versions, review notes and links to projects and tasks. The same assets remain accessible to Production and Sales. This mockup shows two illustrative assets.</p>'],'project-files':['Project files',`<p>The launch references Can artwork v3 and Trade pack v2 from the shared library.</p><a href="${link('marketing')}">Open Marketing assets ${icon('arrow')}</a>`],calendar:['Marketing calendar','<p>The calendar presents the same marketing work by date. This is a navigation concept; the calendar screen is not included in these three mockups.</p>'],new:['Add work','<p>Proposed entry point for a task or project. This review prototype does not save data.</p>'],search:['Search Captain','<p>Proposed search across accessible projects, tasks, conversations and assets. This review prototype does not query business data.</p>']};
    let lastTrigger;
    document.addEventListener('click',event=>{const trigger=event.target.closest('[data-sheet]');if(trigger){event.preventDefault();lastTrigger=trigger;const overlay=trigger.closest('.phone').querySelector('.overlay');const [title,body]=sheetContent[trigger.dataset.sheet];overlay.querySelector('h2').textContent=title;overlay.querySelector('.sheet-body').innerHTML=body;overlay.hidden=false;overlay.querySelector('.close').focus();}if(event.target.closest('.close')||event.target.classList.contains('overlay'))closeSheet();});
    function closeSheet(){document.querySelectorAll('.overlay').forEach(o=>o.hidden=true);lastTrigger?.focus();}
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeSheet();if(event.key==='Tab'){const open=document.querySelector('.overlay:not([hidden])');if(!open)return;const elements=[...open.querySelectorAll('button,a[href]')];const first=elements[0],last=elements.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  </script>
</body>
