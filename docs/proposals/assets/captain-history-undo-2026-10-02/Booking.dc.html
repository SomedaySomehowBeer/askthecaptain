<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking card, editing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./captain.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap">
<style>
body{margin:0}
a{color:#276744}a:hover{color:#1f5638}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px">
<div class="top">
<a class="back" href="#top" aria-label="Back to the thread list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Threads</a>
<div class="top-actions">
<button class="icon-btn" aria-label="Star thread"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8-4.2-4.1 5.9-.9z"/></svg></button>
<div class="avatar">MC</div>
</div>
</div>
<div class="card">
<div class="card-head">
<h1 class="title card-title">Canning line, Thu 8 Oct</h1>
<span class="chip">Confirmed</span>
<button class="icon-btn" aria-label="Hide details" style="width: 32px; height: 32px; color: #142619"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
</div>
<div class="field">
<label for="b-title">Title</label>
<input class="input" id="b-title" value="Summer lager canning run">
</div>
<div class="facts">
<div class="field">
<label for="b-eq">Equipment</label>
<select class="input" id="b-eq"><option>Canning line</option><option>Fermenter 2</option><option>Bright tank</option></select>
</div>
<div class="field">
<label for="b-date">Date</label>
<input class="input" id="b-date" value="Thu 8 Oct 2026">
</div>
<div class="field">
<label for="b-start">Start</label>
<input class="input input-focus" id="b-start" value="8:00 am">
</div>
<div class="field">
<label for="b-end">End</label>
<input class="input" id="b-end" value="12:00 pm">
</div>
<div class="field">
<label for="b-setup">Setup</label>
<select class="input" id="b-setup"><option>30 minutes</option><option>None</option><option>1 hour</option></select>
</div>
<div class="field">
<label for="b-clean">Cleanup</label>
<select class="input" id="b-clean"><option>30 minutes</option><option>None</option><option>1 hour</option></select>
</div>
</div>
<div class="note note-ok">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
<p>Holds the canning line from 7:30 am to 12:30 pm, with setup and cleanup. That time is free.</p>
</div>
<div class="row">
<button class="btn btn-primary grow">Save changes</button>
<button class="btn">Cancel</button>
</div>
<p class="muted">The time, setup and cleanup are saved as one change and undone together.</p>
<div class="row">
<button class="btn btn-quiet" style="padding: 0; color: #6b4a0c">Cancel this booking</button>
<span class="grow"></span>
<a class="link" href="History.dc.html">History</a>
</div>
</div>
<div class="msgs">
<div class="msg">
<div class="avatar avatar-sm">TR</div>
<div class="msg-main">
<div class="msg-head"><span class="name">Tom Reilly</span><span class="time">Thu 2:14 pm</span></div>
<p>Thursday morning works for the crew.</p>
</div>
</div>
</div>
<div class="composer"><span>Message</span><button class="btn btn-primary">Send</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
