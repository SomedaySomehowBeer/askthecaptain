<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stocktake</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./captain.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap">
<style>
body{margin:0}
a{color:#276744}a:hover{color:#1f5638}
.loc{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#54655a;padding:6px 4px 4px}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #e6ece2;background:#fff}
.item:last-child{border-bottom:0}
.item-text{flex:1;min-width:0}
.item-name{font-weight:600;color:#142619}
.item-last{font-size:12px;color:#54655a}
.count{width:92px;min-height:44px;border:1px solid #c6d2c1;border-radius:10px;background:#fff;padding:0 10px;font:inherit;font-size:17px;color:#142619;text-align:right}
.count-done{border-color:#276744;background:#e9f2e4}
.group{border:1px solid #d8e0d3;border-radius:14px;overflow:hidden;background:#fff}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px">
<div class="top">
<a class="back" href="#top" aria-label="Back to the thread list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Threads</a>
<div class="avatar">MC</div>
</div>
<h1 class="title h1">Stocktake</h1>
<p class="sub">Type what you count. Items you skip are left as they are.</p>
<div class="scroll" style="gap: 8px">
<p class="loc">Cool room</p>
<div class="group">
<label class="item"><span class="item-text"><span class="item-name" style="display: block">Pale malt</span><span class="item-last">11 bags · counted Mon 28 Sep by Tom</span></span><input class="count count-done" value="12" inputmode="decimal" aria-label="Pale malt, bags"></label>
<label class="item"><span class="item-text"><span class="item-name" style="display: block">Wheat malt</span><span class="item-last">4 bags · counted Mon 28 Sep by Tom</span></span><input class="count count-done" value="4" inputmode="decimal" aria-label="Wheat malt, bags"></label>
<label class="item"><span class="item-text"><span class="item-name" style="display: block">Citra hops</span><span class="item-last">2.5 kg · counted Mon 21 Sep by Maya</span></span><input class="count" placeholder="kg" inputmode="decimal" aria-label="Citra hops, kg"></label>
</div>
<p class="loc">Packaging store</p>
<div class="group">
<label class="item"><span class="item-text"><span class="item-name" style="display: block">330 ml cans</span><span class="item-last">4,200 cans · counted Mon 28 Sep by Tom</span></span><input class="count" placeholder="cans" inputmode="decimal" aria-label="330 ml cans"></label>
<label class="item"><span class="item-text"><span class="item-name" style="display: block">Pallet wrap</span><span class="item-last">1 roll · counted Mon 28 Sep by Tom</span></span><input class="count" placeholder="rolls" inputmode="decimal" aria-label="Pallet wrap, rolls"></label>
<label class="item"><span class="item-text"><span class="item-name" style="display: block">Summer lager labels</span><span class="item-last">Not counted yet</span></span><input class="count" placeholder="sheets" inputmode="decimal" aria-label="Summer lager labels, sheets"></label>
</div>
<button class="btn btn-quiet" style="align-self: flex-start; padding: 0 4px">Add an item</button>
</div>
<div class="bar">
<p class="grow value">2 of 6 counted</p>
<button class="btn">Cancel</button>
<button class="btn btn-primary">Save stocktake</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
