name: mobile
# apps/mobile (mobile foundation contract §8 and §9, M-shell): client boundary guard, SDK compatibility, typecheck,
# pure-logic tests and web/iOS/Android bundle exports. Exports verify JavaScript bundling; the scan checks named server secrets and canaries; they are not a native build, a signed build or device evidence. No secret is available to this workflow.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/env.ts' # the guard reads the API's secret names from it
      - 'apps/e2e/scripts/mobile-shell-*'
      - 'apps/e2e/package.json' # the Playwright version the browser approximation uses
      - '.github/workflows/mobile.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'patches/**'
      - 'tsconfig.base.json'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/env.ts'
      - 'apps/e2e/scripts/mobile-shell-*'
      - 'apps/e2e/package.json'
      - '.github/workflows/mobile.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'patches/**'
      - 'tsconfig.base.json'
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # The guard is plain Node, so it runs before anything is installed: a forbidden dependency fails here first.
      - name: Client boundary guard tests
        run: node --test apps/mobile/scripts/*.test.mjs
      - name: Client boundary guard (manifest, source and config)
        run: node apps/mobile/scripts/check-boundary.mjs
      - run: pnpm install --frozen-lockfile
      - name: Expo SDK compatibility
        run: pnpm --dir apps/mobile exec expo install --check
      - name: Typecheck
        run: pnpm --dir apps/mobile run check
      - name: Generated Android backup configuration (not a native build)
        run: |
          pnpm --dir apps/mobile exec expo config --type introspect --json > "$RUNNER_TEMP/captain-mobile-config.json"
          node apps/mobile/scripts/check-android-backup.mjs "$RUNNER_TEMP/captain-mobile-config.json"
      - name: Pure-logic tests
        run: pnpm --dir apps/mobile run test
      # Public build configuration only, pointing nowhere real. Server-style variables hold unique canary values: the
      # bundle check below fails if any of them, a secret variable name or a postgres URL reaches an exported bundle.
      - name: Export web, iOS and Android bundles (JavaScript only; not a native build)
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          EXPO_PUBLIC_APP_URL: https://app.example.invalid
          DATABASE_URL: postgres://canary-mobile-export@db.example.invalid/canary
          MASTER_KEY: canary-mobile-master-key-must-not-bundle
          GOOGLE_CLIENT_SECRET: canary-mobile-google-secret-must-not-bundle
          SPRITES_API_TOKEN: canary-mobile-sprites-token-must-not-bundle
        # The harness selector is explicitly unset for every production export (docs/plans/
        # expo-mobile-auth-composition-2026-09.md §7.1), so these bundles use the default router root, src/app.
        run: |
          rm -rf apps/mobile/dist
          for platform in web ios android; do
            env -u CAPTAIN_MOBILE_HARNESS pnpm --dir apps/mobile exec expo export --platform "$platform" --output-dir "dist/$platform" --max-workers 2
          done
      # The test-only account harness: a separate web-only export into its own directory, with the same synthetic public
      # URLs and secret canaries. It is never a native build (app.config.ts refuses one) and is never deployed.
      - name: Export the account harness (web only; test-only)
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          EXPO_PUBLIC_APP_URL: https://app.example.invalid
          DATABASE_URL: postgres://canary-mobile-export@db.example.invalid/canary
          MASTER_KEY: canary-mobile-master-key-must-not-bundle
          GOOGLE_CLIENT_SECRET: canary-mobile-google-secret-must-not-bundle
          SPRITES_API_TOKEN: canary-mobile-sprites-token-must-not-bundle
        run: |
          rm -rf apps/mobile/dist-harness
          CAPTAIN_MOBILE_HARNESS=1 pnpm --dir apps/mobile exec expo export --platform web --output-dir dist-harness --max-workers 2
      # Secrets and canaries in all four exports; the harness marker and any harness/app path absent from all three
      # production exports, and the marker present in the harness export (so its absence elsewhere means something).
      - name: Client boundary guard (exported bundles and harness exclusion)
        env:
          BOUNDARY_CANARY_VALUES: canary-mobile-export,canary-mobile-master-key-must-not-bundle,canary-mobile-google-secret-must-not-bundle,canary-mobile-sprites-token-must-not-bundle
        run: node apps/mobile/scripts/check-boundary.mjs apps/mobile/dist/web apps/mobile/dist/ios apps/mobile/dist/android --harness-export apps/mobile/dist-harness
      # React Native Web in Chromium at phone widths, served from separate production and test-only harness exports on ephemeral loopback ports. A browser
      # approximation of the shell: not native rendering, gestures, accessibility services or device evidence.
      - name: Install Chromium for the shell approximation
        run: pnpm --filter @captain/e2e exec playwright install --with-deps chromium
      - name: Expo web shell and cookie-session browser checks
        env:
          MOBILE_SHELL_SCREENSHOTS: ${{ github.workspace }}/apps/e2e/test-results/mobile-shell
        run: node apps/e2e/scripts/mobile-shell-ci.mjs
      # Synthetic account and shell screenshots only: no real account, credential or business data exists in this job.
      - name: Retain shell screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-shell
          path: apps/e2e/test-results/mobile-shell/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record what this workflow does not prove
        if: always()
        run: |
          {
            echo '### Mobile shell checks'
            echo 'Bundle exports for web, iOS and Android are JavaScript bundles only.'
            echo 'They are not a native build, a signed build, a simulator run or device acceptance.'
            echo 'The browser check runs the production cookie client with synthetic API answers, plus the equipment and account harness, at phone and desktop widths. Real API cookie tests run against Postgres separately.'
          } >> "$GITHUB_STEP_SUMMARY"
