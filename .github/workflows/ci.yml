name: ci
# Executable client-proof assets under docs/ have their own client-proof.yml workflow.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18 # Postgres 18 with the vector extension the retrieval index needs (D21)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: captain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d captain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/captain_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: relative imports use .ts specifiers
        run: |
          if grep -rnE "from ['\"]\.\.?/[^'\"]*\.js['\"]" --include='*.ts' --include='*.tsx' packages/*/src apps/*/src 2>/dev/null; then
            echo '::error::relative imports must use .ts specifiers'
            exit 1
          fi
      # Turbo otherwise groups/buffers whole package logs on GitHub Actions. Stream progress
      # during the API/engine integration suites; keep real database tests uncached and serial.
      - name: Typecheck workspace
        run: pnpm check --log-order=stream
      - name: Test workspace against Postgres
        run: pnpm test --log-order=stream
      - name: infra services (plain node, no workspace)
        run: node --test infra/sprites/*.test.mjs infra/embed/*.test.mjs
      - name: browser regression for React retries
        run: |
          pnpm --filter @captain/e2e exec playwright install --with-deps chromium
          pnpm --filter @captain/e2e exec playwright test react-retry.spec.ts --project chromium
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Linked-chat browser suites against the real API and disposable Postgres, each on its own fresh workspace
  # fixture (loopback only, synthetic data, no hosted credentials). Separate from `check` for its own time budget.
  chat-browser:
    runs-on: ubuntu-latest
    # Two suites of at most 12 minutes each (chat-ci.mjs), plus install, build, fixture setup/cleanup and upload.
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: captain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d captain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/captain_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @captain/e2e exec playwright install --with-deps chromium
      - name: Build web once (loopback API and origin)
        env:
          API_URL: http://127.0.0.1:8084
          APP_URL: http://127.0.0.1:3034
        run: pnpm --filter @captain/web build
      - name: Chat suites (fresh fixture each, sequential)
        env:
          CHAT_CI_OUT: ${{ github.workspace }}/apps/e2e/chat-ci-output
        run: node apps/e2e/scripts/chat-ci.mjs
      # Only synthetic screenshots and redacted logs are written to this directory; fixture data.json never is.
      - name: Retain chat browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-browser
          path: |
            apps/e2e/chat-ci-output/**/*.png
            apps/e2e/chat-ci-output/**/*.log
          if-no-files-found: ignore
          retention-days: 7
