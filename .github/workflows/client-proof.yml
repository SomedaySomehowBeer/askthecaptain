name: client-proof
# This is executable code outside the pnpm workspace, despite living beside proposal docs.
# Checks prove the fictional harness and bundle exports, not native-device acceptance.
on:
  pull_request:
    paths:
      - 'docs/proposals/assets/captain-client-proof-2026-09-23/**'
      - '!docs/proposals/assets/captain-client-proof-2026-09-23/**/*.md'
      - '!docs/proposals/assets/captain-client-proof-2026-09-23/evidence/**'
      - '.github/workflows/client-proof.yml'
      - 'apps/e2e/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'docs/proposals/assets/captain-client-proof-2026-09-23/**'
      - '!docs/proposals/assets/captain-client-proof-2026-09-23/**/*.md'
      - '!docs/proposals/assets/captain-client-proof-2026-09-23/evidence/**'
      - '.github/workflows/client-proof.yml'
      - 'apps/e2e/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: client-proof-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/proposals/assets/captain-client-proof-2026-09-23
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      PROOF_EVIDENCE_DIR: /tmp/captain-proof-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/proposals/assets/captain-client-proof-2026-09-23/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Export web, iOS and Android bundles
        run: npm run export
      - name: Install existing browser-test dependency
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @captain/e2e
      - name: Check timeline and chat in Chromium
        working-directory: .
        run: |
          pnpm --filter @captain/e2e exec playwright install --with-deps chromium
          node docs/proposals/assets/captain-client-proof-2026-09-23/browser-check.mjs --headless
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-proof-browser
          path: /tmp/captain-proof-evidence/
          if-no-files-found: ignore
          retention-days: 7
